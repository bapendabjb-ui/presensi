<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presensi · Panel</title>
  <meta name="theme-color" content="#08080a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <script>
    if (localStorage.theme === "dark" || (!("theme" in localStorage) &&
        matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  </script>
</head>
<body class="h-full font-sans">
  <div class="flex h-full">

    <!-- ============================ Sidebar ============================ -->
    <aside id="sidebar"
           class="fixed lg:static inset-y-0 left-0 z-50 w-[264px] shrink-0 surface border-r line
                  flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-300">

      <div class="h-16 px-5 flex items-center justify-between border-b line shrink-0">
        <a href="#/dashboard" class="flex items-center gap-2.5">
          <div class="grid place-items-center h-9 w-9 rounded-xl bg-brand-600 text-white shadow-lg shadow-brand-600/25">
            <i data-lucide="scan-line" class="h-[18px] w-[18px]"></i>
          </div>
          <div>
            <p class="font-extrabold text-strong text-[15px] leading-none tracking-tight">Presensi</p>
            <p class="text-[10px] text-muted font-semibold mt-1 tracking-wide uppercase">Event Attendance</p>
          </div>
        </a>
        <button data-close-sidebar class="btn btn-ghost btn-icon lg:hidden" aria-label="Tutup menu">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <p class="px-3 pt-2 pb-2 text-[10px] font-bold uppercase tracking-wider text-muted">Utama</p>
        <a href="#/dashboard" class="nav-item" data-nav="dashboard">
          <i data-lucide="layout-dashboard" class="h-[18px] w-[18px]"></i> Dashboard
        </a>
        <a href="#/events" class="nav-item" data-nav="events">
          <i data-lucide="calendar-days" class="h-[18px] w-[18px]"></i> Event
          <span class="ml-auto text-[11px] font-bold text-muted" data-count="events"></span>
        </a>
        <a href="#/participants" class="nav-item" data-nav="participants">
          <i data-lucide="users" class="h-[18px] w-[18px]"></i> Peserta
          <span class="ml-auto text-[11px] font-bold text-muted" data-count="participants"></span>
        </a>

        <p class="px-3 pt-5 pb-2 text-[10px] font-bold uppercase tracking-wider text-muted">Operasional</p>
        <a href="#/checkin" class="nav-item" data-nav="checkin">
          <i data-lucide="qr-code" class="h-[18px] w-[18px]"></i> Check-in
        </a>
        <a href="#/reports" class="nav-item" data-nav="reports">
          <i data-lucide="clipboard-list" class="h-[18px] w-[18px]"></i> Laporan
        </a>
      </nav>

      <!-- Kartu ajakan mode kiosk -->
      <div class="p-3 shrink-0">
        <div class="rounded-xl2 p-4 bg-brand-600 text-white relative overflow-hidden">
          <div class="absolute -right-6 -top-6 h-24 w-24 rounded-full bg-white/10"></div>
          <div class="absolute -right-2 -bottom-8 h-20 w-20 rounded-full bg-white/10"></div>
          <i data-lucide="maximize" class="h-5 w-5 mb-2.5 relative"></i>
          <p class="font-bold text-sm relative">Mode Kiosk</p>
          <p class="text-[12px] text-white/75 mt-1 leading-relaxed relative">
            Layar penuh untuk meja registrasi.
          </p>
          <a href="/kiosk" target="_blank"
             class="mt-3 inline-flex items-center gap-1.5 text-[12px] font-bold bg-white/15 hover:bg-white/25
                    transition rounded-lg px-2.5 h-8 relative">
            Buka kiosk <i data-lucide="arrow-up-right" class="h-3.5 w-3.5"></i>
          </a>
        </div>
      </div>

      <div class="p-3 pt-0 shrink-0">
        <button id="logout" class="nav-item w-full hover:text-rose-600 dark:hover:text-rose-400">
          <i data-lucide="log-out" class="h-[18px] w-[18px]"></i> Keluar
        </button>
      </div>
    </aside>

    <div id="scrim" class="fixed inset-0 z-40 bg-black/50 backdrop-blur-sm hidden lg:hidden"></div>

    <!-- ============================ Konten ============================ -->
    <div class="flex-1 flex flex-col min-w-0">

      <header class="h-16 shrink-0 surface border-b line flex items-center gap-3 px-4 sm:px-6 sticky top-0 z-30">
        <button data-open-sidebar class="btn btn-ghost btn-icon lg:hidden" aria-label="Buka menu">
          <i data-lucide="menu" class="h-5 w-5"></i>
        </button>

        <div class="min-w-0">
          <h1 id="page-title" class="text-[15px] font-bold truncate">Dashboard</h1>
          <p id="page-sub" class="text-[12px] text-muted truncate hidden sm:block"></p>
        </div>

        <div class="ml-auto flex items-center gap-2">
          <div class="hidden md:flex items-center gap-2 h-9 px-3 rounded-xl surface-sunken text-[12px] font-semibold">
            <span class="relative flex h-2 w-2">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-70"></span>
              <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            <span id="clock" class="text-muted tabular-nums"></span>
          </div>
          <a href="/kiosk" target="_blank" class="btn btn-outline btn-sm hidden sm:inline-flex">
            <i data-lucide="scan-line" class="h-4 w-4"></i> Kiosk
          </a>
          <button id="theme" class="btn btn-ghost btn-icon" aria-label="Ganti tema">
            <i data-lucide="sun-moon" class="h-[18px] w-[18px]"></i>
          </button>
        </div>
      </header>

      <main id="view" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8"></main>
    </div>
  </div>

  <!-- Wadah modal & toast -->
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-[100] flex flex-col gap-2.5 items-end pointer-events-none"></div>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/vendor/jsQR.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/scanner.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
