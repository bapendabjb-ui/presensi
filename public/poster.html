<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poster Pendaftaran</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    @page { size: A4 portrait; margin: 0 }
    /* Poster selalu dicetak terang — tinta hitam di kertas putih. */
    @media print {
      .poster { border: none !important; box-shadow: none !important;
                width: 210mm; height: 297mm; border-radius: 0 !important }
      .poster, .poster * { background-color: transparent !important }
      .poster { background: #fff !important }
    }
  </style>
</head>
<body class="font-sans surface-page min-h-screen">

  <div class="no-print sticky top-0 z-10 surface border-b line">
    <div class="max-w-3xl mx-auto px-5 h-14 flex items-center gap-3">
      <a href="/#/events" class="btn btn-ghost btn-sm"><i data-lucide="arrow-left" class="h-4 w-4"></i> Panel</a>
      <p class="text-sm font-bold text-strong ml-1">Poster pendaftaran</p>
      <div class="ml-auto flex gap-2">
        <button id="theme" class="btn btn-ghost btn-icon" aria-label="Ganti tema">
          <i data-lucide="sun-moon" class="h-4 w-4"></i>
        </button>
        <button onclick="print()" class="btn btn-primary btn-sm">
          <i data-lucide="printer" class="h-4 w-4"></i> Cetak A4
        </button>
      </div>
    </div>
  </div>

  <main class="max-w-3xl mx-auto p-5 sm:p-8">
    <div id="root"></div>
    <p class="no-print text-center text-[12px] text-muted mt-5">
      Tempel di meja registrasi atau pintu masuk. Pengunjung memindai QR ini dengan kamera HP.
    </p>
  </main>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async function () {
      const { api, esc, fmtDayLong, fmtTime, emptyState } = window.UI;
      const id = location.pathname.split("/").pop();
      const root = document.getElementById("root");

      try {
        const event = await api.get("/api/events/" + id);
        if (!event.public_token) {
          throw new Error(
            "Pendaftaran mandiri untuk event ini belum dinyalakan. " +
            "Buka Event, klik ikon pensil, lalu pilih mode pendaftaran mandiri."
          );
        }

        const url = location.origin + "/daftar/" + event.public_token;

        root.innerHTML =
          '<div class="poster card mx-auto p-12 text-center" style="max-width:640px">' +
            '<p class="text-[11px] font-extrabold uppercase tracking-[0.22em] text-brand-500">' +
              (event.self_register === "hadir" ? "Daftar &amp; Check-in" : "Pendaftaran Peserta") + "</p>" +

            '<h1 class="text-[34px] font-extrabold leading-[1.12] mt-4 break-words">' + esc(event.name) + "</h1>" +

            '<p class="text-[15px] text-muted mt-3">' +
              (event.starts_at ? esc(fmtDayLong(event.starts_at)) + " · " + esc(fmtTime(event.starts_at)) : "") +
            "</p>" +
            (event.location ? '<p class="text-[15px] text-muted mt-1">' + esc(event.location) + "</p>" : "") +

            '<div class="my-9 inline-block p-5 bg-white rounded-3xl border-2 line">' +
              '<img id="qr" alt="QR pendaftaran" class="block" style="width:300px;height:300px" />' +
            "</div>" +

            '<p class="text-2xl font-extrabold text-strong">Pindai untuk mendaftar</p>' +
            '<p class="text-[15px] text-muted mt-2 leading-relaxed max-w-sm mx-auto">' +
              "Arahkan kamera HP ke kode di atas, lalu isi nama dan kontak Anda." +
            "</p>" +

            '<div class="mt-8 pt-6 border-t line">' +
              '<p class="text-[11px] font-bold uppercase tracking-wider text-muted">Atau buka tautan ini</p>' +
              '<p class="text-[13px] font-bold text-strong mt-2 break-all">' + esc(url) + "</p>" +
            "</div>" +
          "</div>";

        // QR dibuat di sisi klien memakai endpoint QR generik milik server.
        document.getElementById("qr").src =
          "/api/events/" + event.id + "/register-qr.png?size=600";

        document.title = "Poster · " + event.name;
      } catch (err) {
        root.innerHTML = '<div class="card">' +
          emptyState({ icon: "qr-code", title: "Poster belum bisa dibuat", message: err.message }) + "</div>";
      }

      lucide.createIcons({ nameAttr: "data-lucide" });
    })();
  </script>
</body>
</html>
