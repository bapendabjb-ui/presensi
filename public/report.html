<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laporan Presensi</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    @media print {
      thead { display: table-header-group }
      tr { break-inside: avoid }
    }
  </style>
</head>
<body class="font-sans surface-page min-h-screen">

  <div class="no-print sticky top-0 z-10 surface border-b line">
    <div class="max-w-5xl mx-auto px-5 h-14 flex items-center gap-3">
      <a href="/#/reports" class="btn btn-ghost btn-sm"><i data-lucide="arrow-left" class="h-4 w-4"></i> Panel</a>
      <p class="text-sm font-bold text-strong ml-1">Pratinjau cetak</p>
      <div class="ml-auto flex gap-2">
        <button id="theme" class="btn btn-ghost btn-icon" aria-label="Ganti tema">
          <i data-lucide="sun-moon" class="h-4 w-4"></i>
        </button>
        <button id="csv" class="btn btn-outline btn-sm">
          <i data-lucide="file-down" class="h-4 w-4"></i> CSV
        </button>
        <button onclick="print()" class="btn btn-primary btn-sm">
          <i data-lucide="printer" class="h-4 w-4"></i> Cetak
        </button>
      </div>
    </div>
  </div>

  <main id="root" class="max-w-5xl mx-auto p-5 sm:p-8"></main>

  <script src="/vendor/lucide.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    (async function () {
      const { api, esc, fmtDate, fmtDayLong, fmtTime, fmtNumber, emptyState } = window.UI;

      const id = location.pathname.split("/").pop();
      const status = new URLSearchParams(location.search).get("status") || "";
      const root = document.getElementById("root");

      document.getElementById("csv").addEventListener("click", () => {
        location.href = "/api/reports/event/" + id + "/export.csv" + (status ? "?status=" + status : "");
      });

      try {
        const { event, rows, ringkasan, perTipe } =
          await api.get("/api/reports/event/" + id + (status ? "?status=" + status : ""));

        const label = { hadir: "Hanya peserta hadir", belum: "Hanya peserta belum hadir" }[status] || "Seluruh peserta";

        root.innerHTML =
          '<div class="card p-8">' +

            /* Kop laporan */
            '<div class="flex items-start justify-between gap-6 pb-6 border-b line">' +
              "<div>" +
                '<p class="text-[10px] font-extrabold uppercase tracking-[0.18em] text-brand-500">Laporan Presensi</p>' +
                '<h1 class="text-2xl font-extrabold mt-2 leading-tight">' + esc(event.name) + "</h1>" +
                '<p class="text-sm text-muted mt-2">' +
                  (event.starts_at ? esc(fmtDayLong(event.starts_at)) + " · " + esc(fmtTime(event.starts_at)) : "Tanggal belum diatur") +
                "</p>" +
                (event.location ? '<p class="text-sm text-muted mt-0.5">' + esc(event.location) + "</p>" : "") +
              "</div>" +
              '<div class="text-right shrink-0">' +
                '<div class="inline-grid place-items-center h-11 w-11 rounded-xl bg-brand-600 text-white mb-2">' +
                  '<i data-lucide="scan-line" class="h-5 w-5"></i></div>' +
                '<p class="text-[11px] text-muted font-semibold">Dicetak</p>' +
                '<p class="text-[12px] font-bold text-strong">' + esc(fmtDate(new Date().toISOString().slice(0, 10), false)) + "</p>" +
              "</div>" +
            "</div>" +

            /* Ringkasan angka */
            '<div class="grid grid-cols-2 sm:grid-cols-4 gap-4 py-6 border-b line">' +
              [
                ["Total peserta", fmtNumber(ringkasan.total), "text-strong"],
                ["Hadir", fmtNumber(ringkasan.hadir), "text-emerald-600 dark:text-emerald-400"],
                ["Belum hadir", fmtNumber(ringkasan.belum), "text-amber-600 dark:text-amber-400"],
                ["Kehadiran", ringkasan.persentase + "%", "text-brand-600 dark:text-brand-400"],
              ].map(([label, value, tone]) =>
                '<div><p class="text-[11px] font-bold uppercase tracking-wider text-muted">' + label + "</p>" +
                '<p class="text-2xl font-extrabold mt-1 ' + tone + '">' + value + "</p></div>"
              ).join("") +
            "</div>" +

            /* Rincian per tipe tiket */
            (perTipe.length > 1
              ? '<div class="py-6 border-b line">' +
                  '<p class="text-[11px] font-bold uppercase tracking-wider text-muted mb-3">Per tipe tiket</p>' +
                  '<div class="grid sm:grid-cols-3 gap-3">' +
                    perTipe.map((t) =>
                      '<div class="rounded-xl surface-sunken px-4 py-3">' +
                        '<p class="text-[13px] font-bold text-strong">' + esc(t.tipe) + "</p>" +
                        '<p class="text-sm text-muted mt-0.5 tabular-nums">' +
                          fmtNumber(t.hadir) + " hadir dari " + fmtNumber(t.total) + "</p>" +
                      "</div>"
                    ).join("") +
                  "</div></div>"
              : "") +

            /* Tabel */
            '<div class="pt-6">' +
              '<div class="flex items-center justify-between mb-3">' +
                '<p class="text-[11px] font-bold uppercase tracking-wider text-muted">Daftar peserta</p>' +
                '<p class="text-[11px] font-semibold text-muted">' + label + " · " + fmtNumber(rows.length) + " baris</p>" +
              "</div>" +
              (rows.length
                ? '<div class="overflow-x-auto"><table class="w-full text-sm">' +
                    '<thead><tr class="border-b-2 line">' +
                      '<th class="th w-10">#</th><th class="th">Nama</th><th class="th">Kode</th>' +
                      '<th class="th">Instansi</th><th class="th">Tipe</th><th class="th">Waktu hadir</th>' +
                      '<th class="th w-24">Tanda tangan</th>' +
                    "</tr></thead><tbody>" +
                    rows.map((r, i) =>
                      '<tr class="border-b line">' +
                        '<td class="td text-muted tabular-nums">' + (i + 1) + "</td>" +
                        '<td class="td font-semibold text-strong">' + esc(r.name) + "</td>" +
                        '<td class="td"><code class="text-[12px] font-bold">' + esc(r.code) + "</code></td>" +
                        '<td class="td text-muted">' + esc(r.org || "—") + "</td>" +
                        '<td class="td text-muted">' + esc(r.ticket_type) + "</td>" +
                        '<td class="td tabular-nums">' +
                          (r.checked_in_at ? esc(fmtDate(r.checked_in_at, true)) : '<span class="text-muted">Belum hadir</span>') +
                        "</td>" +
                        '<td class="td"></td>' +
                      "</tr>"
                    ).join("") +
                  "</tbody></table></div>"
                : emptyState({ icon: "search-x", title: "Tidak ada data", message: "Filter ini tidak menghasilkan baris apa pun." })) +
            "</div>" +

            /* Blok tanda tangan */
            '<div class="mt-10 flex justify-end">' +
              '<div class="text-center text-sm">' +
                '<p class="text-muted">Mengetahui,</p>' +
                '<div class="h-16"></div>' +
                '<p class="font-bold text-strong border-t line pt-2 px-8">Penanggung Jawab Acara</p>' +
              "</div>" +
            "</div>" +
          "</div>";

        document.title = "Laporan · " + event.name;
      } catch (err) {
        root.innerHTML = '<div class="card">' +
          emptyState({ icon: "server-crash", title: "Laporan tidak tersedia", message: err.message }) + "</div>";
      }

      lucide.createIcons({ nameAttr: "data-lucide" });
    })();
  </script>
</body>
</html>
